<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="@@ENDERECO_DO_CSS">
    <title>Calculadora</title>
</head>
<body>
    <main>
        <h1>Raiz quadrada</h1>
        <form id="calculo">
            <label for="primeiro-numero">Digite o valor para descobrir a raiz quadrada</label>
            <input type="number" id="primeiro-numero">
            <button type="submit">Calcular!</button>
        </form>
        <div class="resultado">
           <p>A raiz quadrada desse número é:</p> <span id="resultado-final"></span>
        </div>
    </main>
    <script src="@@ENDERECO_DO_JS"></script>
</body>
</html>
